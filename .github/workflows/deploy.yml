# Deploy GitHub main to Cloudflare Workers on every push.

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_STATUS_PAGE_URL: https://upwatch.online/status
      KUMA_BASE_URL: https://status.upwatch.online
      KUMA_STATUS_PAGE_SLUG: upwatch
      VITE_KUMA_PUBLIC_URL: https://status.upwatch.online/status/upwatch
      VITE_KUMA_PUSH_URL: https://status.upwatch.online/api/push/5pyQgQR1m8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

      - name: Validate Supabase keys before deploy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node infra/verify-auth-secrets.mjs

      - name: Patch Kuma cron + set Cloudflare worker name
        run: |
          node infra/patch-kuma-cron.mjs
          node -e "const fs=require('fs');const p='.output/server/wrangler.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.name='upwatch';j.triggers={crons:['*/2 * * * *']};if(j.assets?.directory) j.assets.directory=j.assets.directory.replace(/\\\\/g,'/');fs.writeFileSync(p,JSON.stringify(j,null,2));"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub repo secrets to publish upwatch.online"
            exit 1
          fi
          npx wrangler deploy --config .output/server/wrangler.json

      - name: Sync Worker runtime secrets
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          sync_required() {
            local name="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
            printf '%s' "$val" | npx wrangler secret put "$name" --config .output/server/wrangler.json
          }
          sync_optional() {
            local name="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "Skipping optional secret: $name"
              return 0
            fi
            printf '%s' "$val" | npx wrangler secret put "$name" --config .output/server/wrangler.json
          }
          sync_required SUPABASE_URL "$SUPABASE_URL"
          sync_required SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"
          sync_required SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          sync_optional CRON_SECRET "$CRON_SECRET"
          sync_optional BREVO_API_KEY "$BREVO_API_KEY"
          sync_optional TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          sync_optional KUMA_BASE_URL "https://status.upwatch.online"
          sync_optional KUMA_STATUS_PAGE_SLUG "upwatch"
          sync_optional KUMA_PUSH_URL "https://status.upwatch.online/api/push/5pyQgQR1m8"
          sync_optional KUMA_METRICS_API_KEY "${{ secrets.KUMA_METRICS_API_KEY }}"
          if [ -z "${{ secrets.STRIPE_SECRET_KEY }}" ] || [ -z "${{ secrets.STRIPE_PRICE_PRO }}" ] || [ -z "${{ secrets.STRIPE_PRICE_BUSINESS }}" ]; then
            echo "::warning::Stripe secrets missing — billing checkout will not work until STRIPE_* are set"
          else
            sync_required STRIPE_SECRET_KEY "${{ secrets.STRIPE_SECRET_KEY }}"
            sync_required STRIPE_PRICE_PRO "${{ secrets.STRIPE_PRICE_PRO }}"
            sync_required STRIPE_PRICE_BUSINESS "${{ secrets.STRIPE_PRICE_BUSINESS }}"
            sync_optional STRIPE_WEBHOOK_SECRET "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          fi

      - name: Verify Supabase auth keys
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node infra/verify-auth-secrets.mjs --url https://upwatch.online
          curl -sf "https://upwatch.online/api/public/setup/health" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!d.ok) { console.error(d); process.exit(1); } console.log('Worker auth health OK');"
